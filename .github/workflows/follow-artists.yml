name: Follow Spotify artists

on:
  schedule:
    - cron: "0 5 * * 5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spotify-artist-auto-follow
  cancel-in-progress: false

jobs:
  follow-artists:
    if: vars.SOURCE_PLAYLIST_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Follow missing artists
        env:
          SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
          SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
          SPOTIPY_REFRESH_TOKEN: ${{ secrets.SPOTIPY_REFRESH_TOKEN }}
          SPOTIPY_REDIRECT_URI: ${{ vars.SPOTIPY_REDIRECT_URI }}
          SOURCE_PLAYLIST_ID: ${{ vars.SOURCE_PLAYLIST_ID }}
          ALLOW_EMBED_FALLBACK: ${{ vars.ALLOW_EMBED_FALLBACK }}
          EMBED_REQUEST_DELAY_SECONDS: ${{ vars.EMBED_REQUEST_DELAY_SECONDS }}
          DRY_RUN: ${{ vars.DRY_RUN }}
        run: python follow_artists.py
